name: old_app_test
description: Sample Flutter app to test if the latest KARTE Flutter SDK is compatible with old build environments.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '2.19.0' # Dart SDK v2.19.0 is included in Flutter SDK v3.7.0.
  flutter: '3.7.0' # Test with the oldest supported Flutter SDK.

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  karte_core:
    path: ../../karte_core
  karte_in_app_messaging:
    path: ../../karte_in_app_messaging
  karte_notification:
    path: ../../karte_notification
  karte_variables:
    path: ../../karte_variables
  karte_visual_tracking:
    path: ../../karte_visual_tracking

dependency_overrides:
  karte_core:
    path: ../../karte_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
