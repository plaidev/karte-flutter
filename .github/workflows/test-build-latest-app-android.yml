name: Build Android app with latest environment
on:
  # TODO: Enable to run automatically before release.
  workflow_dispatch:
env:
  FLUTTER_VERSION: '3.35.1'
  FLUTTER_CHANNEL: 'stable'
  # SHA256 checksum from https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
  FLUTTER_SHA256: 58efd9d1e570a1bf976e218cfbbcca3f23b21b873d765a74e045d5b9022ab515
  JAVA_VERSION: '21'
jobs:
  build-android:
    name: Build Android app with latest environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Flutter
        working-directory: ${{ runner.temp }}
        env:
          FLUTTER_ARCHIVE: flutter_linux_${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_CHANNEL }}.tar.xz
        run: |
          curl -fsSLO "https://storage.googleapis.com/flutter_infra_release/releases/${FLUTTER_CHANNEL}/linux/${FLUTTER_ARCHIVE}"
          echo "${FLUTTER_SHA256}  ${FLUTTER_ARCHIVE}" | sha256sum -c
          tar xf "${FLUTTER_ARCHIVE}" -C "${HOME}"
          echo "${HOME}/flutter/bin" >> $GITHUB_PATH
      - name: Print Flutter version
        run: flutter --version
      - name: Get dependencies
        working-directory: build_tests/latest_app_test
        run: flutter pub get
      - name: Build APK
        working-directory: build_tests/latest_app_test
        run: flutter build apk --release
