name: Build iOS app with old environment
on:
  # TODO: Enable to run automatically before release.
  workflow_dispatch:
env:
  # NOTE: Refer to each module's pubspec.yaml (e.g. karte_core/pubspec.yaml) for minimum SDK version.
  FLUTTER_VERSION: '3.7.0'
  FLUTTER_CHANNEL: 'stable'
  # SHA256 checksum from https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json
  FLUTTER_SHA256: 8c3196363c7e79ead5bd2bd657cad6915afdf5b315ca51bfa7e569f490ec3de4
jobs:
  build-ios:
    name: Build iOS app with old environment
    # macos-15 includes Xcode 16.0
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install Flutter
        working-directory: ${{ runner.temp }}
        env:
          FLUTTER_ARCHIVE: flutter_macos_arm64_${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_CHANNEL }}.zip
        run: |
          curl -fsSLO "https://storage.googleapis.com/flutter_infra_release/releases/${FLUTTER_CHANNEL}/macos/${FLUTTER_ARCHIVE}"
          echo "${FLUTTER_SHA256}  ${FLUTTER_ARCHIVE}" | shasum -a 256 -c
          unzip -q "${FLUTTER_ARCHIVE}" -d "${HOME}"
          echo "${HOME}/flutter/bin" >> $GITHUB_PATH
      - name: Print Flutter version
        run: flutter --version
      - name: Get dependencies
        working-directory: build_tests/old_app_test
        run: flutter pub get
      - name: Build iOS app
        working-directory: build_tests/old_app_test
        run: flutter build ios --release --no-codesign
