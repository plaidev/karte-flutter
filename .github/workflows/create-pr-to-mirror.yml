name: "Create PR to mirror repo"
on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch: # Enable manual execution for troubleshooting
jobs:
  sync-to-mirror:
    runs-on: ubuntu-latest
    # Should be executed on the dev repo.
    if: github.event.pull_request.merged == true && github.repository != 'plaidev/karte-flutter'
    permissions:
      contents: read
    steps:
      - name: Checkout master
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: master
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config --global user.email "git@users.noreply.github.com"
          git config --global user.name "github actions"
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_TEAM_GITHUB_APP_AGENT_ID }}
          private-key: ${{ secrets.APP_TEAM_GITHUB_APP_PRIVATE_KEY }}
          owner: plaidev
          repositories: |
            karte-flutter
      - name: Checkout mirror repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: plaidev/karte-flutter
          ref: master
          token: ${{ steps.app-token.outputs.token }}
          path: mirror-repo
          fetch-depth: 0
      - name: Add source remote
        run: |
          cd mirror-repo
          git remote add source ../
      - name: Check for changes
        id: changes
        run: |
          cd mirror-repo
          git fetch source master
          # Check if there are any differences
          if git diff --quiet HEAD source/master; then
            echo "No changes to sync, exiting"
            exit 1
          fi
      - name: Sync and push changes
        run: |
          cd mirror-repo
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/plaidev/karte-flutter.git
          git checkout -b ${{ github.event.pull_request.head.ref }}
          if ! git merge source/master --no-edit; then
            echo "❌ Merge conflicts detected"
            git status
            exit 1
          fi
          git push origin HEAD
      - name: Create PR to mirror repo
        id: create_pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd mirror-repo
          PR_URL=$(gh pr create \
            --title "Release changes" \
            --body "" \
            --base master \
            --head $(git branch --show-current))
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
      - name: Notify Slack on success
        if: success()
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            ✅ Successfully created PR to sync changes to mirror repo
            PR: ${{ steps.create_pr.outputs.pr_url }}
          SLACK_COLOR: success
      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            ❌ Failed to create PR to sync changes to mirror repo
          SLACK_COLOR: failure
