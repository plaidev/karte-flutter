name: Publish

on:
  pull_request:
    branches: [master]
    types: [closed]

env:
  FLUTTER_VERSION: 3.13.0
  FLUTTER_CHANNEL: 'stable'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: set up flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: ${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_CHANNEL }}
      - name: set up melos
        run: |
          flutter pub global activate melos
          ./scripts/setup.sh
      - name: publish dry run
        if: github.event.pull_request.merged == false
        run: |
          melos publish --dry-run -y 2>&1 | grep -e ^Publishing -e '^No unpublished packages found' -e '^\* ' > publish-dry-run.log
      - name: commnet pr
        if: github.event.pull_request.merged == false
        uses: machine-learning-apps/pr-comment@78e77cd435e0f9706512ea294d846058ae46f7ff # 1.0.0
        with:
          path: publish-dry-run.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish
        if: github.event.pull_request.merged == true
        run: |
          melos publish --no-dry-run --git-tag-version -y
          git push origin --tags
